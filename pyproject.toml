[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ox-lang"
version = "0.4.1"
description = "ox — a sturdy little language for automation & tooling"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "the ox language authors" }]
keywords = ["language", "scripting", "automation", "workflow", "devops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Languages",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pyyaml>=6"]

[project.scripts]
ox = "ox.cli:main"

[tool.setuptools]
packages = ["ox", "ox.builtins"]
